<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
  <img class="qr" src="./assets/images/qr_code.png" />
$for(people)$
  <p class="author">$people.name$</p>
  <p class="institute">$people.institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
</section>
